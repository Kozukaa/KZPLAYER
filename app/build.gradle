plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.kzplayer.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.kzplayer.app"
        minSdk 21
        targetSdk 34
        def vcEnv = System.getenv("VERSION_CODE")
        versionCode (vcEnv != null && !vcEnv.trim().isEmpty()) ? vcEnv.trim().toInteger() : 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            // Protection gratuite : R8/ProGuard obfusque le code et réduit les ressources.
            // Important : build en release signé, pas en debug, pour profiter de cette protection.
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    // Décodeur audio FFmpeg pour ExoPlayer/Media3 : aide sur AC3/EAC3/DTS et vieux codecs audio.
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.3.1+2'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'io.coil-kt:coil:2.4.0'
}
